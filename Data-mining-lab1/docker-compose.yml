services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: annapurna
      POSTGRES_PASSWORD: annapurna_dev
      POSTGRES_DB: annapurna
    ports: ["5432:5432"]
    volumes:
      - ./data/masters.sql:/docker-entrypoint-initdb.d/01-masters.sql:ro
      - postgres_data:/var/lib/postgresql/data
  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: annapurna
      MINIO_ROOT_PASSWORD: annapurna-dev-password
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
volumes:
  postgres_data:
  minio_data:
